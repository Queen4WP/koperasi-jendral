<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Emblem: Modern Hex Shield & Cooperative Pillars -->
  <g transform="translate(2, 2)">
    <!-- Base Outer Shield -->
    <path d="M26 2 L48 13 L48 37 C48 48 26 53 26 53 C26 53 4 48 4 37 L4 13 Z" 
          fill="url(#shieldGrad)" />
    <!-- Inner Dark Core -->
    <path d="M26 6 L44 15 L44 35 C44 44 26 48 26 48 C26 48 8 44 8 35 L8 15 Z" 
          fill="#0A1128" />
    
    <!-- Stylized Golden Interlocking Arch (Cooperative Strength) -->
    <rect x="15" y="21" width="4.5" height="19" rx="2.25" fill="url(#goldGrad)" />
    <rect x="32.5" y="21" width="4.5" height="19" rx="2.25" fill="url(#goldGrad)" />
    <path d="M17 23 C21 16, 31 16, 35 23" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" />
    
    <!-- Central Cooperative Growth Core -->
    <circle cx="26" cy="31" r="3.5" fill="#10B981" filter="url(#subtleGlow)" />
    <path d="M26 28 L26 38" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- 2. Brand Name: KOSPIN (Bold, Clear, Sharp) -->
  <text x="58" y="29" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="22" font-weight="900" letter-spacing="1.2" fill="url(#textGrad)">
    KOSPIN
  </text>
  
  <!-- 3. Subtitle: CORE ENTERPRISE SYSTEM (Legible & Vibrant) -->
  <text x="59" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#10B981">
    CORE ENTERPRISE SYSTEM
  </text>

  <!-- 4. Verified Legal Pill Badge -->
  <g transform="translate(162, 12)">
    <rect x="0" y="0" width="84" height="18" rx="9" fill="#162244" stroke="#10B981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="9" cy="9" r="3" fill="#10B981"/>
    <text x="17" y="12.5" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#6EE7B7" letter-spacing="0.4">
      OJK/KEMENKOP
    </text>
  </g>
</svg>
